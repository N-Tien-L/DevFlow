# Test-only overrides: in-memory H2 so the smoke test runs without a live PostgreSQL
# (local builds, CI). Production/dev still use PostgreSQL per application.yml.
spring:
  datasource:
    url: jdbc:h2:mem:devflow-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    model:
      chat: none
    openai:
      api-key: test-dummy-key-not-real
    mcp:
      server:
        name: devflow
        version: 0.0.1-SNAPSHOT

devflow:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: devflow

