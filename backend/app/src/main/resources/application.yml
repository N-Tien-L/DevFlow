# DevFlow backend — scaffold defaults. Every external value is env-overridable;
# see .env.example at the repo root for the docker-compose wiring.
spring:
  application:
    name: devflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devflow}
    username: ${SPRING_DATASOURCE_USERNAME:devflow}
    password: ${SPRING_DATASOURCE_PASSWORD:devflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  ai:
    model:
      # "none" keeps the app bootable without a provider key. Set to "openai" and
      # provide OPENAI_API_KEY to enable the LLM client in the AI service module.
      chat: ${AI_MODEL_CHAT:none}
      # The OpenAI starter enables every supported model type by default. DevFlow
      # currently uses chat only, so keep the unused clients disabled; otherwise
      # they require an API key even while chat is set to "none".
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
    mcp:
      server:
        name: devflow
        version: 0.0.1-SNAPSHOT
  # Transactional email (T-004A). Local default targets Mailpit (docker compose, UI on :8025);
  # production points MAIL_* at the provider's SMTP relay (e.g. Resend / SES) with STARTTLS.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  # Resolve the client IP from X-Forwarded-For only when the request comes through a trusted
  # (internal) proxy, so rate limits cannot be bypassed with a spoofed header.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

# Observability per ARCHITECTURE.md Section 9: Prometheus scrapes /actuator/prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # An SMTP outage must not mark the whole backend unhealthy (container restarts would not help);
    # delivery failures are tracked by devflow.auth.verification_email{result="failed"} instead.
    mail:
      enabled: false

logging:
  level:
    root: info

devflow:
  websocket:
    # Explicit browser origins are required in production. Comma-separated origins are supported.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    board:
      send-timeout-ms: ${WEBSOCKET_BOARD_SEND_TIMEOUT_MS:100}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: devflow
  verification:
    token-ttl: ${VERIFICATION_TOKEN_TTL:24h}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:DevFlow <no-reply@devflow.local>}
    token-retention: 7d
    unverified-account-retention: 7d
    purge-cron: "0 0 3 * * *"
  # Cloudflare Turnstile on the public registration form (T-004B). Off by default so local runs need
  # no Cloudflare account; production MUST set TURNSTILE_ENABLED=true and TURNSTILE_SECRET_KEY
  # (startup fails if enabled without a secret). Siteverify calls are not retried (single-use tokens).
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    siteverify-url: ${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    connect-timeout: 2s
    read-timeout: 3s
  registration:
    email-domain:
      disposable-check-enabled: true
      extra-blocked-domains: ${REGISTRATION_EXTRA_BLOCKED_DOMAINS:}
      # MX lookups fail open on DNS timeouts; definite answers are cached.
      mx-check-enabled: ${REGISTRATION_MX_CHECK_ENABLED:true}
      mx-lookup-timeout: 2s
      mx-cache-ttl: 1h
  # Token-bucket policies per client key (capacity requests per period).
  rate-limit:
    policies:
      login: { capacity: 5, period: 1m }
      register: { capacity: 3, period: 10m }
      verify-email: { capacity: 10, period: 1m }
      resend-verification: { capacity: 5, period: 1h }
      resend-verification-per-email: { capacity: 3, period: 1h }
      # Authenticated workspace endpoints (T-007) are limited per user id rather than per IP.
      workspace-create: { capacity: 5, period: 1h }
      workspace-invite: { capacity: 20, period: 1h }
      invitation-accept: { capacity: 10, period: 1m }
      workspace-invitation-manage: { capacity: 60, period: 1m }
      # Personal access tokens (T-038): management per user, MCP usage per token, failed attempts per IP.
      pat-create: { capacity: 10, period: 1h }
      pat-manage: { capacity: 60, period: 1m }
      pat-use: { capacity: 300, period: 1m }
      pat-auth-failure: { capacity: 20, period: 1m }
  # Personal access tokens for MCP clients (T-038). Revoked/expired tokens are purged by the nightly
  # auth cleanup job once older than retention.
  pat:
    max-active-per-user: ${PAT_MAX_ACTIVE_PER_USER:10}
    last-used-update-interval: 5m
    retention: 30d
  # Workspace quotas and invitation lifetime (T-007). Expired/revoked invitations are purged by the
  # nightly verification cleanup job once older than invitation-retention.
  workspace:
    max-owned-per-user: ${WORKSPACE_MAX_OWNED_PER_USER:10}
    invitation-ttl: 7d
    max-pending-invitations: 100
    invitation-retention: 7d

# Resilience for outbound calls (ARCHITECTURE.md Section 9.2).
resilience4j:
  retry:
    instances:
      verificationEmail:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.mail.MailException
      invitationEmail:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.mail.MailException
  circuitbreaker:
    instances:
      verificationEmail:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      invitationEmail:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      turnstile:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # A rejected token is a client error, not a Siteverify outage.
        ignore-exceptions:
          - io.devflow.auth.internal.exception.BotChallengeFailedException

