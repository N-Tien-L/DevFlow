# ai-impl slice tests: in-memory H2, no real LLM provider.
spring:
  datasource:
    url: jdbc:h2:mem:ai-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  ai:
    model:
      # The AI module builds its own ChatModel (AiChatClientConfig); keep every starter client off.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      server:
        name: devflow-test
        version: 0.0.1-SNAPSHOT

devflow:
  ai:
    chat:
      model: none

logging:
  level:
    # As in production: never log raw model answers.
    org.springframework.ai.converter.BeanOutputConverter: off
